[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragolex"
version = "0.1.0"
description = "A retrieval-augmented generation (RAG) service built with FastAPI, PostgreSQL and pgvector."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Abdullah Bakir" }]
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Exact pins: this is an application, so every install gets the tested
# versions. Dependabot proposes upgrades.
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "pydantic-settings==2.16.0",
    "aiofiles==25.1.0",
    "pypdf==6.21.2",
    # Reads the images of scanned PDF pages for OCR.
    "pillow==13.0.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "openai==3.32.0",
    # Imported directly by the OpenAI embedder (for its HTTP client type).
    "httpx2==2.13.1",
    "anyio==4.15.1",
    "prometheus-client==0.26.0",
    # AES-GCM for encryption at rest (ENCRYPTION_KEYS).
    "cryptography==50.0.2",
    # Argon2id hashes of user accounts' passwords.
    "argon2-cffi==25.1.0",
    # TXT lookups that prove a workspace owns its custom domain.
    "dnspython==2.9.0",
    # Checks the ID tokens of single sign-on (OpenID Connect).
    "PyJWT[crypto]==2.15.0",
    # Checks the XML signatures of SAML sign-ins; lxml reads only what they cover.
    "signxml==5.2.0",
    "lxml==6.1.3",
]

[project.optional-dependencies]
# Tracing (TRACING_ENABLED): spans over OTLP/HTTP. FastAPI brings OpenTelemetry's API
# and traces requests; these export the spans and trace the database queries.
tracing = [
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-aiofiles==25.1.0.20260518",
]

[project.scripts]
ragolex = "ragolex.cli:main"

[project.urls]
Repository = "https://github.com/AbdullahBakir97/Ragolex"
Documentation = "https://github.com/AbdullahBakir97/Ragolex/tree/start-001/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ragolex.persistence" = ["migrations/script.py.mako"]

# Database migrations. Run from the repository root: alembic upgrade head
# The database URL comes from DATABASE_URL (see .env.example).
[tool.alembic]
script_location = "ragolex.persistence:migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["ragolex"]
branch = true
# SQLAlchemy's async engine switches greenlets: without this, lines after an await go unseen.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails below this; raise it as coverage grows.
fail_under = 95
