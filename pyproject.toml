[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-rag"
version = "0.1.0"
description = "A retrieval-augmented generation (RAG) service built with FastAPI, PostgreSQL and pgvector."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdullah Bakir" }]
requires-python = ">=3.11"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Exact pins: this is an application, so every install gets the tested
# versions. Dependabot proposes upgrades.
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.4",
    "pydantic-settings==2.16.0",
    "aiofiles==25.1.0",
    "pypdf==6.21.2",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pgvector==0.5.1",
    "openai==3.32.0",
    # Imported directly by the OpenAI embedder (for its HTTP client type).
    "httpx2==2.13.1",
    "anyio==4.15.1",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-aiofiles==25.1.0.20260518",
]

[project.scripts]
mini-rag = "mini_rag.cli:main"

[project.urls]
Repository = "https://github.com/AbdullahBakir97/Mini-RAG"
Documentation = "https://github.com/AbdullahBakir97/Mini-RAG/tree/start-001/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mini_rag.persistence" = ["migrations/script.py.mako"]

# Database migrations. Run from the repository root: alembic upgrade head
# The database URL comes from DATABASE_URL (see .env.example).
[tool.alembic]
script_location = "mini_rag.persistence:migrations"
file_template = "%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["mini_rag"]
branch = true
# SQLAlchemy's async engine switches greenlets: without this, lines after an await go unseen.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI fails below this; raise it as coverage grows.
fail_under = 95
