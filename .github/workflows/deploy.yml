name: Deploy

# Builds the API and web app images and publishes them to the GitHub Container
# Registry, then deploys them: every push to start-001 to staging, every
# release tag (v1.2.3) to production. Run by hand to deploy a branch, or an
# earlier tag (a rollback), to either. See docs/deployment.md.

on:
  push:
    branches: [start-001]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: An image tag already published (e.g. sha-1a2b3c4 or 1.4.0); empty builds this ref
        type: string
        default: ''

permissions:
  contents: read

jobs:
  images:
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.tag.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the images
        id: tag
        # Registries want lowercase names; the tag is the commit, as sha-<7 characters>.
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags of the API image
        id: app
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.registry }}/ragolex
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=start-001
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tags of the web app image
        id: web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.registry }}/ragolex-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=start-001
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build and publish the web app image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  staging:
    needs: images
    if: >-
      !cancelled() && needs.images.result != 'failure' && (
        github.ref == 'refs/heads/start-001' && github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: staging
      tag: ${{ inputs.tag || needs.images.outputs.tag }}
    secrets: inherit

  production:
    needs: images
    if: >-
      !cancelled() && needs.images.result != 'failure' && (
        startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      contents: read
      packages: read
    with:
      environment: production
      tag: ${{ inputs.tag || needs.images.outputs.tag }}
    secrets: inherit
