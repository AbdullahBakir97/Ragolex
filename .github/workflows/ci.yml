name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragolex
          POSTGRES_PASSWORD: ragolex
          POSTGRES_DB: ragolex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragolex -d ragolex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ragolex:ragolex@localhost:5432/ragolex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test, with coverage
        run: pytest --cov

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        # The web app, then the chat widget's script.
        run: npx vite build && npx vite build --config vite.widget.config.ts

  api-compat:
    # Within /api/v1 the API only grows (docs/versioning.md): a pull request
    # that would break clients of the base branch's API fails, unless it is
    # labelled api-breaking for a new major version.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No breaking changes to the API
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git show "origin/${BASE_REF}:sdk/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "The base branch has no sdk/openapi.json yet: nothing to compare."
            exit 0
          fi
          python tools/api_compat.py "$RUNNER_TEMP/base-openapi.json" sdk/openapi.json

  sdk-python:
    # The Python client: generated from sdk/openapi.json (which tests/test_openapi.py
    # keeps equal to the API's schema), type-checked and tested on its oldest and
    # newest Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" mypy==2.4.0
      - name: Generated code is up to date
        run: python generate.py --check
      - name: Type check
        run: mypy src --strict
      - name: Test
        run: pytest

  sdk-typescript:
    # The TypeScript client: its types are generated from sdk/openapi.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated types are up to date
        run: npm run generate && git diff --exit-code -- src/schema.ts
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  security:
    # Known vulnerabilities in the dependencies (Python and npm, development
    # tools included), and secrets anywhere in the history.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the Python dependencies
        # Resolves pyproject.toml's dependencies on its own, so pip-audit's
        # own packages are not part of the audit.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit .
          pip-audit ./sdk/python
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit the npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Audit the TypeScript SDK's npm dependencies
        working-directory: sdk/typescript
        run: npm audit --audit-level=moderate
      - name: Look for secrets in the history
        env:
          GITLEAKS_VERSION: 8.24.2
          GITLEAKS_SHA256: fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --redact --no-banner

  eval:
    # Retrieval quality on the handbook dataset with a real embedding model,
    # nomic-embed-text in Ollama: a metric that drops below the baseline fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragolex
          # A throwaway database for one job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ragolex_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragolex -d ragolex_eval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ragolex@localhost:5432/ragolex_eval
      EMBEDDING_BASE_URL: http://localhost:11434/v1
      EMBEDDING_MODEL: nomic-embed-text:v1.5
      EMBEDDING_DIMENSIONS: '768'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Start Ollama with the embedding model
        # Started here rather than as a service, so its log does not flood the job's.
        run: |
          docker run --detach --name ollama --publish 11434:11434 ollama/ollama:0.35.1
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:11434/api/version; then break; fi
            sleep 2
          done
          docker exec ollama ollama pull nomic-embed-text:v1.5
      - name: Migrate the database
        run: alembic upgrade head
      - name: Evaluate retrieval
        run: ragolex eval evals/handbook/v1 --baseline evals/baselines/handbook-v1.json --output eval-report.json --save-baseline eval-baseline.json
      - name: Show this run's baseline
        # To copy into evals/baselines/handbook-v1.json when retrieval got better.
        if: always()
        run: if [ -f eval-baseline.json ]; then cat eval-baseline.json; fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  docker:
    # Builds the images and runs the full compose stack: database, migrations, API, web app.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build --detach
      - name: Wait for the stack to be healthy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Upload a file through the API
        run: |
          echo "Ragolex in Docker." > notes.txt
          curl --fail --silent -F "file=@notes.txt;type=text/plain" http://localhost:8000/api/v1/data/upload/demo
      - name: The web app serves its pages and forwards the API
        run: |
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="app">'
          curl --fail --silent http://localhost:3000/projects/demo/documents | grep -q '<div id="app">'
          curl --fail --silent http://localhost:3000/api/v1/projects | grep -q '"name":"demo"'
          curl --fail --silent --output /dev/null http://localhost:3000/docs
      - name: The API and the web app run as unprivileged users
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
