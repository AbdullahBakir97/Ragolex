# The whole stack: docker compose up --build
#   web app on http://localhost:3000, API on http://localhost:8000
#   (other ports: set WEB_PORT, API_PORT or DB_PORT in .env)
# Only the database, to run the API with uvicorn: docker compose up -d db
# With malware scanning of uploads: docker compose --profile scan up --build,
#   and CLAMAV_URL=tcp://clamav:3310 in .env
# Settings are read from .env (copy .env.example first).
services:
  db:
    # PostgreSQL 16 with the pgvector extension (0.8 or newer) for vector search.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ragolex
      POSTGRES_PASSWORD: ragolex
      POSTGRES_DB: ragolex
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Its socket, for the backup service: local connections need no password.
      - db-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragolex -d ragolex"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: ragolex
    env_file: .env
    environment:
      # Inside the stack the database is reached by its service name.
      DATABASE_URL: postgresql+asyncpg://ragolex:ragolex@db:5432/ragolex
      FILES_DIR: /app/assets/files
    # Bring the schema up to date, then serve. Migrations are safe to run on
    # every start: Alembic applies only the missing ones.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn ragolex.main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    # host.docker.internal is this computer, e.g. for Ollama on it; Docker
    # Desktop knows the name, Docker Engine on Linux needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - files:/app/assets/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  clamav:
    # ClamAV's daemon, for scanning uploads (CLAMAV_URL). Started only with
    # --profile scan; it downloads its signatures on start and needs about
    # 1.5 GB of memory.
    image: clamav/clamav:1.4
    profiles: ["scan"]
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  backup:
    # Backs up the database and the uploaded files into ./backups, or restores a
    # backup (tools/backup.sh; see docs/operations.md). Not started by `up`:
    #   docker compose --profile backup run --rm backup create /backups
    #   docker compose --profile backup run --rm backup restore /backups/<archive>
    # It runs in the database's image, for a pg_dump of the server's version, and
    # reaches the database through its socket.
    image: pgvector/pgvector:pg16
    profiles: ["backup"]
    entrypoint: ["sh", "/tools/backup.sh"]
    environment:
      DATABASE_URL: postgresql:///ragolex?host=/var/run/postgresql&user=ragolex
      FILES_DIR: /files
    volumes:
      - ./tools:/tools:ro
      - ./backups:/backups
      - files:/files
      - db-socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

  web:
    # The web interface; it forwards /api to the app service.
    build: ./frontend
    image: ragolex-web
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clamav-db:
  db-data:
  db-socket:
  files:
